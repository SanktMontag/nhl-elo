[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-elo"
version = "0.1.0"
description = "ELO ratings for NHL franchises from the 2005-06 season on"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "lightgbm>=4.3", "scikit-learn>=1.4", "pyarrow>=15"]
xg = ["lightgbm>=4.3", "scikit-learn>=1.4", "pyarrow>=15"]

[project.scripts]
nhl = "nhl_elo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
